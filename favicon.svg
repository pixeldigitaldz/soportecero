<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Container with subtle technical border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#10131C" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Console Prompt '>' -->
  <polyline points="7 11 12 16 7 21" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slashed Zero '0' -->
  <rect x="16" y="9" width="9" height="14" rx="3" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <line x1="18" y1="19.5" x2="23" y2="12.5" stroke="#22D3EE" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Telemetry Indicator Dot -->
  <circle cx="26" cy="6" r="2.5" fill="#06B6D4"/>
  <circle cx="26" cy="6" r="1.2" fill="#E0F2FE"/>
</svg>
